# =============================================================================
# WebowoROS — Docker Compose for E2E Testing
# ⚠️  Everything runs inside containers. Do NOT run tests locally.
# Usage: docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.test.yml up e2e
# =============================================================================

services:
  e2e:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    container_name: ros-e2e
    depends_on:
      - api
      - web
      - postgres
      - redis
    environment:
      - PLAYWRIGHT_BASE_URL=http://web:3000
      - PLAYWRIGHT_API_URL=http://api:4000
      - CI=true
    volumes:
      - ../../e2e:/app/e2e
      - ../../playwright.config.ts:/app/playwright.config.ts
      - ../../packages:/app/packages
      - e2e_node_modules:/app/node_modules
      - e2e_report:/app/e2e-report
      - e2e_results:/app/e2e-results
    networks:
      - ros-net
    command: >
      sh -c "npx playwright install chromium firefox webkit && \
             npx playwright test --reporter=list,html"
    # Keep container alive for report extraction
    # Use: docker compose -f ... run --rm e2e
    # Or:  ./start.sh e2e

volumes:
  e2e_node_modules:
  e2e_report:
  e2e_results:
