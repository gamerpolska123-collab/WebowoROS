version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ros-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - ros-net
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ros-redis-prod
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - ros-net
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-api:latest
    container_name: ros-api-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYU_CLIENT_ID=${PAYU_CLIENT_ID}
      - PAYU_CLIENT_SECRET=${PAYU_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ros-net
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-web:latest
    container_name: ros-web-prod
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.domena.pl
      - NEXT_PUBLIC_WS_URL=wss://ws.domena.pl
    networks:
      - ros-net
    deploy:
      resources:
        limits:
          memory: 256M

  dashboard:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-dashboard:latest
    container_name: ros-dashboard-prod
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.domena.pl
      - NEXT_PUBLIC_WS_URL=wss://ws.domena.pl
    networks:
      - ros-net
    deploy:
      resources:
        limits:
          memory: 256M

  printer-service:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-printer:latest
    container_name: ros-printer-prod
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/usb:/dev/usb
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - ros-net

  nginx:
    image: nginx:alpine
    container_name: ros-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - ./infra/nginx/www:/var/www/certbot:ro
    depends_on:
      - web
      - dashboard
      - api
    networks:
      - ros-net

  watchtower:
    image: containrrr/watchtower
    container_name: ros-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_INCLUDE_RESTARTING=true

networks:
  ros-net:
    driver: bridge
