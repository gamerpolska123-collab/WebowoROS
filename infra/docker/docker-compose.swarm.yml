version: '3.8'

# Docker Swarm — rozproszony deployment na 2-3 serwery
# Wymaga: docker swarm init na managerze + docker swarm join na workerach
#
# Przykładowa topologia:
#   Manager (node.labels.tier=manager): Nginx, API, Dashboard
#   Worker-1 (node.labels.tier=frontend): Web, Redis
#   Worker-2 (node.labels.tier=data): PostgreSQL, Printer
#
# Etykietowanie nodów:
#   docker node update --label-add tier=manager <manager-id>
#   docker node update --label-add tier=frontend <worker-1-id>
#   docker node update --label-add tier=data <worker-2-id>

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - ros-overlay
    deploy:
      placement:
        constraints:
          - node.labels.tier == data
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ros-overlay
    deploy:
      placement:
        constraints:
          - node.labels.tier == frontend
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-api:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=https://domena.pl,https://admin.domena.pl,https://www.domena.pl
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYU_CLIENT_ID=${PAYU_CLIENT_ID}
      - PAYU_CLIENT_SECRET=${PAYU_CLIENT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - ros-overlay
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.tier == manager
      resources:
        limits:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        order: stop-first
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-web:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.domena.pl/v1
      - NEXT_PUBLIC_WS_URL=wss://ws.domena.pl
    networks:
      - ros-overlay
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.labels.tier == frontend
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  dashboard:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-dashboard:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://api.domena.pl/v1
      - NEXT_PUBLIC_WS_URL=wss://ws.domena.pl
    networks:
      - ros-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tier == manager
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  printer-service:
    image: ghcr.io/gamerpolska123-collab/webowo-ros-printer:latest
    restart: unless-stopped
    privileged: true
    volumes:
      - /dev/usb:/dev/usb
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - ros-overlay
    deploy:
      placement:
        constraints:
          - node.labels.tier == data
      resources:
        limits:
          memory: 128M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - dashboard
      - api
    networks:
      - ros-overlay
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 5s
        failure_action: rollback

  # Traefik jako alternatywny reverse proxy (opcjonalnie zamiast Nginx)
  # traefik:
  #   image: traefik:v3.0
  #   restart: unless-stopped
  #   command:
  #     - --api.insecure=true
  #     - --providers.docker.swarmMode=true
  #     - --providers.docker.network=ros-overlay
  #     - --entrypoints.web.address=:80
  #     - --entrypoints.websecure.address=:443
  #     - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
  #     - --certificatesresolvers.letsencrypt.acme.email=admin@domena.pl
  #     - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./letsencrypt:/letsencrypt
  #   networks:
  #     - ros-overlay
  #   deploy:
  #     placement:
  #       constraints:
  #         - node.role == manager

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ros-overlay:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.9.0/24
