version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ros-postgres
    environment:
      POSTGRES_USER: ros_user
      POSTGRES_PASSWORD: ros_password
      POSTGRES_DB: restaurant_db
    volumes:
  redis-data:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ros-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ros_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ros-redis
    ports:
      - "6379:6379"
    volumes:
  redis-data:
      - redis_data:/data
    networks:
      - ros-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: ros-api
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://ros_user:ros_password@postgres:5432/restaurant_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-prod}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://web:3000,http://dashboard:3001
    volumes:
  redis-data:
      - ../../apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/api/node_modules
    ports:
      - "4000:4000"
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ros-net
    command: pnpm --filter api start:dev

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: ros-web
    environment:
      - NEXT_PUBLIC_API_URL=http://api:4000/v1
      - NEXT_PUBLIC_WS_URL=ws://api:4001
    volumes:
  redis-data:
      - ../../apps/web:/app/apps/web
      - /app/node_modules
      - /app/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - ros-net
    command: pnpm --filter web dev

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
    container_name: ros-dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://api:4000/v1
      - NEXT_PUBLIC_WS_URL=ws://api:4001
    volumes:
  redis-data:
      - ../../apps/dashboard:/app/apps/dashboard
      - /app/node_modules
      - /app/apps/dashboard/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - ros-net
    command: pnpm --filter dashboard dev

  printer-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.printer
    container_name: ros-printer
    privileged: true
    volumes:
  redis-data:
      - /dev/usb:/dev/usb
      - ../../apps/printer-service:/app/apps/printer-service
      - /app/node_modules
      - /app/apps/printer-service/node_modules
    environment:
      - REDIS_URL=redis://redis:6379
      - PRINTER_TYPE=escpos
      - PRINTER_INTERFACE=usb
    depends_on:
      - redis
    networks:
      - ros-net
    command: pnpm --filter printer-service dev

volumes:
  redis-data:
  postgres_data:
  redis_data:

networks:
  ros-net:
    driver: bridge
